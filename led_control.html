<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pool LED Controller</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="PoolLED">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a1628">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#0a1628;color:#e0e0e0;min-height:100vh;padding:10px}
        .container{max-width:500px;margin:0 auto}
        h2{text-align:center;padding:10px 0;color:#4fc3f7;font-size:1.2em}
        .warn-box{background:#2c1010;color:#ffb8b8;padding:8px;border-radius:8px;margin-bottom:8px;font-size:13px;line-height:1.4}
        .connect-area{text-align:center;padding:10px;background:#0d2137;border-radius:10px;margin-bottom:10px}
        .connect-area button{padding:10px 30px;font-size:16px;border:none;border-radius:20px;cursor:pointer}
        .btn-connect{background:#4fc3f7;color:#000}
        .btn-disconnect{background:#e57373;color:#fff;display:none}
        .status-bar{display:flex;justify-content:space-around;background:#0d2137;border-radius:10px;padding:8px;margin-bottom:10px;font-size:12px;flex-wrap:wrap}
        .status-item{text-align:center;min-width:45px;margin:2px}
        .status-val{color:#4fc3f7;font-size:15px;font-weight:bold}
        .status-label{color:#888;font-size:10px}
        .section{background:#0d2137;border-radius:10px;padding:10px;margin-bottom:10px}
        .section h3{font-size:14px;color:#4fc3f7;margin-bottom:8px;border-bottom:1px solid #1a3a5c;padding-bottom:5px}
        .btn-row{display:flex;flex-wrap:wrap;gap:6px}
        .btn-row button{flex:1;min-width:55px;padding:8px 4px;font-size:12px;border:none;border-radius:8px;cursor:pointer;background:#1a3a5c;color:#e0e0e0}
        .btn-row button:active{background:#4fc3f7;color:#000}
        .order-area{display:flex;gap:8px;margin-top:8px}
        .order-area input{flex:1;padding:8px;border:1px solid #1a3a5c;border-radius:8px;background:#0a1628;color:#e0e0e0;font-size:14px}
        .order-area button{padding:8px 15px;background:#4fc3f7;color:#000;border:none;border-radius:8px;font-size:13px;cursor:pointer}
        .mode-display{text-align:center;font-size:16px;color:#4fc3f7;padding:5px}
    </style>
</head>
<body>
<div class="container">
    <h2>🏊 Pool LED Controller</h2>

    <div class="warn-box">
        ⚠️ Important: Do NOT open inside Facebook/Instagram/WhatsApp built-in browser.<br>
        iPhone → Use Safari &nbsp;|&nbsp; Android → Use Google Chrome
    </div>

    <div class="connect-area">
        <button class="btn-connect" onclick="connectBLE()">🔗 Connect Device</button>
        <button class="btn-disconnect" id="btnDisconn" onclick="disconnectBLE()">Disconnect</button>
        <p id="connStatus" style="margin-top:5px;font-size:12px;color:#888">Disconnected</p>
    </div>

    <div class="status-bar">
        <div class="status-item"><div class="status-val" id="valTemp">--</div><div class="status-label">Temp ℃</div></div>
        <div class="status-item"><div class="status-val" id="valHum">--</div><div class="status-label">Hum %</div></div>
        <div class="status-item"><div class="status-val" id="valPress">--</div><div class="status-label">hPa</div></div>
    </div>
    <div class="mode-display" id="modeDisplay">Current Mode: --</div>
    <div class="section"><h3>🔌 Power</h3><div class="btn-row"><button onclick="sendCmd('开机')">Power On</button><button onclick="sendCmd('关机')">Power Off</button></div></div>
    <div class="section"><h3>💡 Light</h3><div class="btn-row"><button onclick="sendCmd('常亮')">Solid On</button></div></div>
    <div class="section"><h3>🔆 Brightness</h3><div class="btn-row"><button onclick="sendCmd('亮度25')">25%</button><button onclick="sendCmd('亮度50')">50%</button><button onclick="sendCmd('亮度75')">75%</button><button onclick="sendCmd('亮度100')">100%</button></div></div>
    <div class="section"><h3>🎨 Effect Mode</h3><div class="btn-row"><button onclick="sendCmd('呼吸灯')">Breath</button><button onclick="sendCmd('流水1')">Flow 1</button><button onclick="sendCmd('流水2')">Flow 2</button><button onclick="sendCmd('流水3')">Flow 3</button></div></div>
    <div class="section"><h3>🔢 Sequence</h3><div class="order-area"><input type="text" id="orderInput" placeholder="e.g. 1,3,2"><button onclick="setOrder()">Save</button></div><div class="btn-row" style="margin-top:6px"><button onclick="sendCmd('恢复默认')">Reset Default</button></div></div>
</div>

<script>
// ========== PWA Service Worker Register ==========
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
    .then(reg => console.log("ServiceWorker register success", reg))
    .catch(err => console.warn("ServiceWorker register failed", err));
  });
}

// ==================== BLE 蓝牙通讯 ====================
let bleDevice, bleServer, bleChar, connected = false;
const SVC = "12345678-1234-1234-1234-123456789abc";
const CHR = "abcd1234-1234-1234-1234-123456789abc";

async function connectBLE() {
    try {
        document.getElementById('connStatus').innerText = 'Scanning...';
        bleDevice = await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}]});
        bleServer = await bleDevice.gatt.connect();
        let svc = await bleServer.getPrimaryService(SVC);
        bleChar = await svc.getCharacteristic(CHR);
        await bleChar.startNotifications();
        bleChar.addEventListener('characteristicvaluechanged', onData);
        connected = true;
        document.getElementById('connStatus').innerText = '✅ Connected';
        document.getElementById('btnDisconn').style.display = 'inline-block';
        bleDevice.addEventListener('gattserverdisconnected', () => {
            connected = false;
            document.getElementById('connStatus').innerText = '❌ Disconnected';
            document.getElementById('btnDisconn').style.display = 'none';
        });
    } catch(e) {
        document.getElementById('connStatus').innerText = 'Connect Failed';
        console.error(e);
    }
}
function disconnectBLE() {
    if(bleServer) bleServer.disconnect();
}
async function sendCmd(c) {
    if(!connected||!bleChar) return;
    try{
        await bleChar.writeValueWithResponse(new TextEncoder().encode(c));
    } catch(e){
        console.log("Send command error",e);
    }
}
function setOrder() {
    let v = document.getElementById('orderInput').value.trim();
    if(v) sendCmd('序:' + v);
}

// ==================== 数据接收解析 ====================
function onData(event) {
    try {
        let txt = new TextDecoder().decode(event.target.value);
        let d = JSON.parse(txt);
        document.getElementById('valTemp').innerText = d.t ?? '--';
        document.getElementById('valHum').innerText = d.h ?? '--';
        document.getElementById('valPress').innerText = d.p ?? '--';
        document.getElementById('modeDisplay').innerText = 'Current Mode: ' + (d.mode || '--');
    } catch(e) {}
}
</script>
</body>
</html>
